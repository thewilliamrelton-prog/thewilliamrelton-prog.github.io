<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{ margin:0; padding:0; height:100%; }
  *{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
</style>
<title>Paddock Pass 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f2f6;
    --surface:#ffffff;
    --surface-2:#e9ebf1;
    --border:#dbdfe6;
    --text:#12151a;
    --text-dim:#5c6472;
    --accent:#7c3aed;
    --accent-soft:#efe7ff;
    --pb-green:#0f9d58;
    --fastest:#8b2fd6;
    --fastest-soft:#f1e2ff;
    --warn:#b45309;
    --danger:#dc2626;
    --gold:#8a6a00;
    --silver:#5b6472;
    --bronze:#8a4a1f;
    --gold-bg:#fbe9b0;
    --silver-bg:#e4e7ec;
    --bronze-bg:#f0d3ba;
    --shadow:0 8px 24px rgba(20,20,35,.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0c10;
      --surface:#14171d;
      --surface-2:#1b1f27;
      --border:#272c35;
      --text:#eef1f6;
      --text-dim:#8b93a3;
      --accent:#a077ff;
      --accent-soft:#241a3d;
      --pb-green:#3ddc84;
      --fastest:#c96bff;
      --fastest-soft:#2c1c3d;
      --warn:#ffcc33;
      --danger:#ff6b6b;
      --gold:#f2c14e;
      --silver:#c7ccd4;
      --bronze:#e0995f;
      --gold-bg:#3a2f10;
      --silver-bg:#262a30;
      --bronze-bg:#3a2517;
      --shadow:0 8px 24px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0c10;
    --surface:#14171d;
    --surface-2:#1b1f27;
    --border:#272c35;
    --text:#eef1f6;
    --text-dim:#8b93a3;
    --accent:#a077ff;
    --accent-soft:#241a3d;
    --pb-green:#3ddc84;
    --fastest:#c96bff;
    --fastest-soft:#2c1c3d;
    --warn:#ffcc33;
    --danger:#ff6b6b;
    --gold:#f2c14e;
    --silver:#c7ccd4;
    --bronze:#e0995f;
    --gold-bg:#3a2f10;
    --silver-bg:#262a30;
    --bronze-bg:#3a2517;
    --shadow:0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow',system-ui,sans-serif;
    padding-inline:0;
  }
  h1,h2,h3,.display{
    font-family:'Titillium Web',system-ui,sans-serif;
    text-wrap:balance;
    letter-spacing:.2px;
  }
  .num{ font-variant-numeric: tabular-nums; }
  button, input, select{ font-family:inherit; }

  html,body{ height:100%; }
  #app{ width:100%; min-height:100%; display:flex; flex-direction:column; }
  [hidden]{ display:none !important; }

  /* ---------- MOTION SYSTEM ---------- */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  button, .card, .stat-tile, .predict-card, .btn, .icon-btn, .theme-btn{ transition:transform .15s ease, box-shadow .2s ease, opacity .2s ease; }
  .btn, .icon-btn, .theme-btn, nav.tabbar button, .mode-toggle button{ -webkit-tap-highlight-color:transparent; }
  .btn:active, .icon-btn:active, .theme-btn:active{ transform:scale(.96); }
  nav.tabbar button{ transition:color .18s ease, transform .15s ease; }
  nav.tabbar button:active{ transform:scale(.9); }
  nav.tabbar button.active svg{ transform:translateY(-1px) scale(1.06); transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
  @media (hover:hover){
    .card:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(20,20,35,.14); }
    .stat-tile:hover{ transform:translateY(-1px); }
  }

  @keyframes fadeSlideUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  #main > *{ animation:fadeSlideUp .42s cubic-bezier(.22,1,.36,1) backwards; }
  #main > *:nth-child(1){ animation-delay:.02s; }
  #main > *:nth-child(2){ animation-delay:.07s; }
  #main > *:nth-child(3){ animation-delay:.12s; }
  #main > *:nth-child(4){ animation-delay:.17s; }
  #main > *:nth-child(5){ animation-delay:.22s; }
  #main > *:nth-child(6){ animation-delay:.27s; }
  #main > *:nth-child(7){ animation-delay:.32s; }
  #main > *:nth-child(8){ animation-delay:.37s; }
  #main > *:nth-child(n+9){ animation-delay:.4s; }

  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  .login-card.shake{ animation:shake .5s cubic-bezier(.36,.07,.19,.97); }

  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  #app-screen{ animation:fadeIn .4s ease; }

  @keyframes popIn{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
  .save-msg.ok, .save-msg.err{ animation:popIn .25s ease; display:inline-block; }

  @keyframes tickerFade{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:translateY(0); } }
  #news-text{ display:inline-block; }

  svg.chart path[stroke-dasharray]{ transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-delay:0s !important; transition-duration:.001ms !important; }
    #main > *{ animation:none; }
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    padding: max(24px, env(safe-area-inset-top,0px)) 20px max(24px, env(safe-area-inset-bottom,0px));
    gap:22px;
    background:
      radial-gradient(120% 90% at 15% -10%, var(--accent-soft), transparent 55%),
      var(--bg);
  }
  .brand{ text-align:center; }
  .crest{ display:block; margin:0 auto 14px; width:64px; height:64px; }
  .brand h1{ font-size:29px; font-weight:900; margin:0; letter-spacing:1px; }
  .brand p{ color:var(--text-dim); margin:6px 0 0; font-size:13px; text-transform:uppercase; letter-spacing:1.2px; font-weight:600; }

  .garage-wash{
    background: radial-gradient(130% 170% at 8% -10%, color-mix(in srgb, var(--team-tint, var(--accent)) 20%, transparent), transparent 68%);
    border-radius:16px; padding:14px 16px;
  }
  .news-ticker{
    display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:9px 12px; overflow:hidden;
  }
  .news-ticker .news-tag{
    flex:none; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:#fff;
    background:var(--danger); padding:3px 7px; border-radius:5px; font-family:'Titillium Web',sans-serif;
  }
  .news-ticker #news-text{
    flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-size:12.5px; font-weight:600; transition:opacity .3s;
  }
  .round-chip{
    display:inline-flex; align-items:center; gap:5px; font-family:'Titillium Web',sans-serif;
    font-size:10.5px; font-weight:800; letter-spacing:.4px; color:var(--accent);
    background:var(--accent-soft); padding:3px 10px; border-radius:20px; white-space:nowrap;
  }
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .greeting{ font-size:12.5px; color:var(--text-dim); font-weight:600; margin:0 0 3px; }
  .login-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:22px; box-shadow:var(--shadow);
  }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); margin-bottom:6px; }
  .field input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:16px;
  }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .btn{
    width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent);
    background-image:linear-gradient(135deg, color-mix(in srgb, var(--accent) 78%, white), var(--accent));
    box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
    color:#fff; font-weight:700; font-size:15px; letter-spacing:.3px;
    font-family:'Titillium Web',sans-serif;
  }
  .btn:active{ transform:scale(.97) translateY(1px); box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent); }
  .btn-ghost{ background:transparent; border:1.5px solid var(--border); color:var(--text); }
  .login-error{ color:var(--danger); font-size:13px; font-weight:600; margin-top:10px; min-height:16px; }
  .login-hint{ text-align:center; color:var(--text-dim); font-size:12px; margin-top:4px; }

  /* ---------- APP SHELL ---------- */
  #app-screen{ display:flex; flex-direction:column; min-height:100vh; }
  header.topbar{
    position:sticky; top:0; z-index:5;
    padding: max(14px, env(safe-area-inset-top,0px)) 18px 12px;
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .who{ display:flex; align-items:center; gap:10px; min-width:0; }
  .avatar{
    width:38px; height:38px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:'Titillium Web',sans-serif; font-weight:900; font-size:14px; color:#fff;
  }
  .who-text{ min-width:0; }
  .who-text .name{ font-weight:700; font-size:15px; line-height:1.15; }
  .who-text .team{ font-size:11px; color:var(--text-dim); }
  .icon-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
    border-radius:9px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .hdr-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .theme-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
    border-radius:9px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .theme-btn svg{ width:17px; height:17px; }

  .highlight-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  .highlight-row:first-child{ border-top:none; }
  .highlight-icon{
    width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); font-size:14px;
  }
  .highlight-text{ min-width:0; flex:1; }
  .highlight-text .h-label{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); font-weight:700; }
  .highlight-text .h-val{ font-size:13.5px; font-weight:700; margin-top:1px; }

  .podium-reveal{
    display:flex; align-items:flex-end; justify-content:center; gap:8px; padding:8px 4px 0;
  }
  .podium-slot{
    flex:1; max-width:120px; display:flex; flex-direction:column; align-items:center; text-align:center;
    animation:podiumRise .6s cubic-bezier(.22,1,.36,1) backwards;
  }
  .podium-slot .p-avatar{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-family:'Titillium Web',sans-serif; font-weight:900; font-size:15px; color:#fff; margin-bottom:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .podium-slot .p-name{ font-weight:800; font-size:13px; }
  .podium-slot .p-pts{ font-size:11px; color:var(--text-dim); font-weight:600; margin-top:1px; }
  .podium-slot .p-note{ font-size:9.5px; color:var(--text-dim); margin-top:2px; }
  .podium-slot .p-step{
    width:100%; border-radius:8px 8px 0 0; margin-top:10px; display:flex; align-items:flex-start; justify-content:center;
    padding-top:6px; font-family:'Titillium Web',sans-serif; font-weight:900; color:#fff; font-size:15px;
  }
  .podium-slot.s1{ order:2; } .podium-slot.s1 .p-step{ height:58px; background:linear-gradient(160deg, var(--gold), color-mix(in srgb, var(--gold) 60%, black)); animation-delay:.15s; }
  .podium-slot.s2{ order:1; } .podium-slot.s2 .p-step{ height:40px; background:linear-gradient(160deg, var(--silver), color-mix(in srgb, var(--silver) 60%, black)); animation-delay:.05s; }
  .podium-slot.s3{ order:3; } .podium-slot.s3 .p-step{ height:26px; background:linear-gradient(160deg, var(--bronze), color-mix(in srgb, var(--bronze) 60%, black)); animation-delay:.25s; }
  @keyframes podiumRise{ from{ opacity:0; transform:translateY(16px) scale(.92); } to{ opacity:1; transform:translateY(0) scale(1); } }

  .pos-change{ display:inline-flex; align-items:center; gap:2px; font-size:10.5px; font-weight:800; font-family:'Titillium Web',sans-serif; }
  .pos-change.up{ color:var(--pb-green); }
  .pos-change.down{ color:var(--danger); }
  .pos-change.same{ color:var(--text-dim); }
  .pos-change.new{ color:var(--accent); }

  .chart-tooltip{
    position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:6px 9px; font-size:11px; font-weight:700; color:var(--text);
    box-shadow:var(--shadow); white-space:nowrap; opacity:0; transition:opacity .15s ease; z-index:5;
    transform:translate(-50%,-115%);
  }
  .chart-tooltip.show{ opacity:1; }
  .chart-wrap{ position:relative; }
  .chart-hit{ cursor:pointer; }

  .round-picker{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .round-picker-label{ font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); font-weight:800; margin-right:2px; }
  .round-pick{
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim);
    font-family:'Titillium Web',sans-serif; font-weight:800; font-size:11.5px; padding:6px 11px; border-radius:20px; cursor:pointer;
  }
  .round-pick.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .qs-block + .qs-block{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--border); }
  .qs-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .qs-head b{ font-family:'Titillium Web',sans-serif; font-weight:900; font-size:15px; }
  .qs-head span{ font-size:11.5px; color:var(--text-dim); font-weight:600; }
  .qs-notes{ margin-top:8px; font-size:11.5px; color:var(--text-dim); font-weight:600; display:flex; flex-direction:column; gap:3px; }
  .h2h-round-head{
    margin:14px 0 2px; padding-top:12px; border-top:1px dashed var(--border); text-align:center;
    font-family:'Titillium Web',sans-serif; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim);
  }

  /* ---------- latest results pop-up ---------- */
  .rp-backdrop{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;
    background:rgba(6,7,14,.62); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); animation:fadeIn .25s ease;
  }
  .rp-card{
    position:relative; width:100%; max-width:480px; max-height:calc(100% - 8px); overflow-y:auto; overscroll-behavior:contain;
    background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:20px 18px 16px;
    box-shadow:0 24px 64px rgba(0,0,0,.5); animation:rpPop .45s cubic-bezier(.22,1,.36,1);
  }
  @keyframes rpPop{ from{ opacity:0; transform:translateY(28px) scale(.96); } to{ opacity:1; transform:none; } }
  @keyframes rpRow{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .rp-close{
    position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:10px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:20px; line-height:1;
  }
  .rp-kicker{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-right:42px; }
  .rp-new{
    background:var(--danger); color:#fff; font-family:'Titillium Web',sans-serif; font-weight:800; font-size:9.5px;
    letter-spacing:.6px; text-transform:uppercase; padding:3px 8px; border-radius:5px;
  }
  .rp-round{ font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
  .rp-title{ font-size:26px; font-weight:900; margin:8px 0 0; line-height:1.1; }
  .rp-sub{ color:var(--text-dim); font-size:13px; font-weight:600; margin:2px 0 12px; }
  .rp-winner{
    border-radius:14px; padding:12px 14px; margin-bottom:10px;
    background:linear-gradient(120deg, color-mix(in srgb, var(--team) 26%, transparent), transparent 120%);
    border:1px solid color-mix(in srgb, var(--team) 38%, var(--border));
    animation:rpRow .5s cubic-bezier(.22,1,.36,1) .12s backwards;
  }
  .rp-win-kicker{ font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--text-dim); font-weight:800; }
  .rp-win-name{ font-family:'Titillium Web',sans-serif; font-weight:900; font-size:24px; line-height:1.1; margin-top:2px; }
  .rp-win-sub{ font-size:12px; color:var(--text-dim); font-weight:600; margin-top:2px; }
  .rp-list{ display:flex; flex-direction:column; }
  .rp-row{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:1px solid var(--border); border-radius:10px;
    animation:rpRow .45s cubic-bezier(.22,1,.36,1) backwards; animation-delay:calc(.18s + var(--i,0) * .06s);
  }
  .rp-row:first-child{ border-top-color:transparent; }
  .rp-row.you{ background:var(--accent-soft); border-top-color:transparent; }
  .rp-row.absent{ opacity:.62; }
  .rp-pos{ width:34px; flex:none; font-family:'Titillium Web',sans-serif; font-weight:900; font-size:14px; }
  .rp-row.dnf .rp-pos{ color:var(--danger); }
  .rp-who{ flex:1; min-width:0; }
  .rp-name{ font-weight:700; font-size:14px; }
  .rp-you{ margin-left:6px; font-size:9px; font-weight:800; letter-spacing:.5px; background:var(--accent); color:#fff; padding:1px 6px; border-radius:4px; vertical-align:2px; }
  .rp-detail{ font-size:11px; color:var(--text-dim); font-weight:600; margin-top:1px; }
  .rp-pts{ font-family:'Titillium Web',sans-serif; font-weight:900; font-size:15px; color:var(--text-dim); min-width:34px; text-align:right; }
  .rp-pts.scored{ color:var(--pb-green); }
  .rp-highlights{ margin-top:10px; font-size:11.5px; color:var(--text-dim); font-weight:600; text-align:center; }
  .rp-actions{ display:flex; gap:10px; margin-top:14px; }
  .rp-actions .btn{ flex:1; padding:12px 8px; font-size:14px; }
  .rp-actions .btn-ghost{ box-shadow:none; }

  .podium-banner{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px; margin-bottom:2px;
    background:linear-gradient(120deg, var(--gold-bg), transparent 130%); border:1px solid var(--border);
    position:relative; overflow:hidden;
  }
  .podium-banner .trophy{ font-size:28px; flex:none; }
  .podium-banner .ptxt b{ display:block; font-family:'Titillium Web',sans-serif; font-weight:900; font-size:15px; color:var(--gold); }
  .podium-banner .ptxt span{ font-size:11.5px; color:var(--text-dim); }

  #confetti-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .confetti-piece{
    position:absolute; top:-16px; width:8px; height:14px; opacity:0.9;
    animation-name:confetti-fall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh) rotate(540deg); opacity:0.4; }
  }
  @media (prefers-reduced-motion: reduce){
    .confetti-piece{ animation:none; display:none; }
  }

  .countdown-bar{
    margin:12px 16px 0; padding:12px 14px; border-radius:14px;
    background:linear-gradient(135deg, var(--accent-soft), transparent 120%);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .countdown-bar .cd-label{ font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-dim); font-weight:700; }
  .countdown-bar .cd-race{ font-weight:700; font-size:14px; margin-top:2px; }
  .countdown-bar .cd-time{ font-family:'Titillium Web',sans-serif; font-weight:900; font-size:20px; color:var(--accent); white-space:nowrap; }

  main{ flex:1; padding:16px 16px 90px; display:flex; flex-direction:column; gap:16px; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }
  .card h2{ font-size:13px; text-transform:uppercase; letter-spacing:.7px; color:var(--text-dim); margin:0 0 12px; font-weight:700; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (min-width:600px){ .stat-grid{ grid-template-columns:repeat(4,1fr); } }
  .stat-tile{
    background:var(--surface-2); border-radius:12px; padding:12px 14px;
  }
  .stat-tile .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); font-weight:700; }
  .stat-tile .value{ font-family:'Titillium Web',sans-serif; font-weight:900; font-size:22px; margin-top:4px; }
  .stat-tile .sub{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  .chip{

  .chip-fastest{ background:var(--fastest-soft); color:var(--fastest); }
  .chip-pb{ background:color-mix(in srgb, var(--pb-green) 18%, transparent); color:var(--pb-green); }
  .chip-na{ background:var(--surface-2); color:var(--text-dim); }
  .chip-gold{ background:var(--gold-bg); color:var(--gold); }
  .chip-silver{ background:var(--silver-bg); color:var(--silver); }
  .chip-bronze{ background:var(--bronze-bg); color:var(--bronze); }
  .tyre-chip{
    display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;

  }
  .tyre-chip.tyre-M{ background:#ffcc33; color:#1a1a1a; border-color:#ffe08a; }
  .tyre-chip.tyre-H{ background:#f2f2f2; color:#1a1a1a; border-color:#ffffff; }

  /* predicted points widget (spending-card style) */
  .predict-card{
    background:linear-gradient(160deg,#1c1030,#0b0d16 65%);
    color:#fff; border-radius:18px; padding:18px 18px 14px; position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
  }
  :root[data-theme="light"] .predict-card, :root:not([data-theme="dark"]) .predict-card{ }
  .predict-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .predict-label{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#b9b3d6; font-weight:700; }
  .predict-value{ font-family:'Titillium Web',sans-serif; font-weight:900; font-size:30px; margin-top:4px; }
  .predict-max{ font-size:12px; color:#b9b3d6; font-weight:600; margin-top:2px; text-align:right; font-variant-numeric:tabular-nums;}
  .mode-toggle{ display:flex; gap:6px; background:rgba(255,255,255,.08); padding:3px; border-radius:20px; }
  .mode-toggle button{

  }

  svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
  .chart-axis-label{ font-size:8.5px; fill:var(--text-dim); font-family:'Barlow',sans-serif; }
  .predict-card .chart-axis-label{ fill:#8f88ac; }

  table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  table.tbl th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim);

  }

  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .pos-badge{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:7px; font-weight:800; font-size:12px; font-family:'Titillium Web',sans-serif;
  }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim); font-weight:600; }

  .team-badge{
    display:inline-block; padding:2px 9px; border-radius:6px; font-size:10.5px; font-weight:700; color:#fff;
  }

  .race-summary{ display:flex; flex-direction:column; gap:8px; }
  .race-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--border); }
  .race-row:first-child{ border-top:none; }
  .race-row .k{ color:var(--text-dim); }
  .race-row .v{ font-weight:700; }

  select.sel{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
  }
  .h2h-pickers{ display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-bottom:14px;}
  .h2h-vs{ font-family:'Titillium Web',sans-serif; font-weight:900; color:var(--text-dim); font-size:13px; }
  .h2h-row{ display:grid; grid-template-columns:1fr 90px 1fr; align-items:center; padding:10px 2px; border-top:1px solid var(--border); gap:6px; }
  .h2h-row:first-child{ border-top:none; }
  .h2h-row .metric{ text-align:center; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-dim); font-weight:700; }
  .h2h-val{ font-weight:800; font-size:15px; text-align:center; padding:4px 0; border-radius:8px; }
  .h2h-val.left{ text-align:right; padding-right:8px; }
  .h2h-val.right{ text-align:left; padding-left:8px; }
  .h2h-win{ color:var(--pb-green); }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-label{ width:92px; flex:none; font-size:12.5px; font-weight:700; }
  .bar-track{ flex:1; height:16px; background:var(--surface-2); border-radius:8px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:8px; }
  .bar-val{ width:34px; flex:none; text-align:right; font-weight:800; font-size:13px; }

  .admin-warning{
    background:var(--fastest-soft); color:var(--fastest); border-radius:10px; padding:10px 12px;

  .cal-edit-num{ font-size:11px; font-weight:800; color:var(--text-dim); font-family:'Titillium Web',sans-serif; }
  .cal-name-input, .cal-date-input{

  .calendar-info{ flex:1; min-width:0; }
  .calendar-info .c-name{ font-weight:700; font-size:14px; }
  .calendar-info .c-date{ font-size:11.5px; color:var(--text-dim); margin-top:1px; }
  .calendar-tag{
    flex:none; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    padding:3px 9px; border-radius:20px; background:var(--surface-2); color:var(--text-dim);
  }
  .calendar-tag.done{ background:color-mix(in srgb, var(--pb-green) 18%, transparent); color:var(--pb-green); }
  .calendar-tag.next{ background:var(--accent-soft); color:var(--accent); }

  .gap-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  .gap-row:first-child{ border-top:none; }

  .gap-row .gap-vals b{ font-weight:800; }
  .gap-vals .gv-label{ display:block; font-size:9px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-dim); font-weight:700; }

  .reliab-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  .reliab-row:first-child{ border-top:none; }
  .reliab-bar{ flex:1; height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; }
  .reliab-bar .seg-fin{ background:var(--pb-green); }
  .reliab-bar .seg-ret{ background:var(--danger); }
  .save-msg{ font-size:12px; font-weight:700; margin-top:8px; min-height:16px; }
  .save-msg.ok{ color:var(--pb-green); }
  .save-msg.err{ color:var(--danger); }

  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    padding:8px 0 max(8px, env(safe-area-inset-bottom,0px));
    display:flex; justify-content:flex-start;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav.tabbar::-webkit-scrollbar{ display:none; }
  nav.tabbar button{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-dim); font-size:10px; font-weight:700; padding:4px 10px; cursor:pointer;
    font-family:'Titillium Web',sans-serif; flex:0 0 auto; min-width:70px;
  }
  nav.tabbar button.active{ color:var(--accent); }
  nav.tabbar svg{ width:20px; height:20px; }
  nav.tabbar::after{ content:''; flex:0 0 auto; width:56px; }

  .swipe-hint{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%);
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
    padding:5px 12px; border-radius:20px; font-size:10.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:9; white-space:nowrap;
  }
  .swipe-hint.show{ opacity:1; }

  .section-title{ font-size:19px; font-weight:900; margin:2px 0 0; }
  .section-sub{ color:var(--text-dim); font-size:12.5px; margin:2px 0 0; }
</style>

  </div>

  // League points that sit outside any race result (added by William). `round` is the
  // round they were awarded in, so the position-change arrows and the chart stay honest.
  var ADJUSTMENTS = [
    { driver:'davide', points:5, round:3, label:'Bonus points' }
  ];

  function defaultCalendar(){
    var rounds=[];
    for(var i=1;i<=TOTAL_ROUNDS;i++){
      var completedRace = RACES.filter(function(r){return r.completed;}).find(function(r){return r.round===i;});
      rounds.push({ round:i, name: completedRace ? completedRace.name : ('Round '+i), date:null });
    }
    return rounds;
  }

  /* ===================== ROUND HELPERS ===================== */
  function completedRaces(){ return RACES.filter(function(r){ return r.completed; }); }
  function resultFor(race, id){ return (race && race.results && race.results[id]) || null; }
  function fastestLapIn(race){
    var best=null;
    DRIVERS.forEach(function(d){
      var r = resultFor(race, d.id);
      if(r && r.bestLap!=null && (best===null || r.bestLap<best.time)) best = { id:d.id, time:r.bestLap, str:r.bestLapStr };
    });
    return best;
  }
  function poleIn(race){
    var found=null;
    DRIVERS.forEach(function(d){ var r=resultFor(race,d.id); if(r && r.qualiPos===1 && !found) found={ id:d.id, str:r.qualiTimeStr }; });
    return found;
  }
  function roundTag(race){ return 'R'+race.round+' '+race.short; }
  function gridText(res){
    if(!res) return '—';
    if(res.grid!=null) return 'P'+res.grid;
    return res.gridLabel || 'Not captured';
  }
  function qualiText(res){
    if(!res) return '—';
    if(res.missedQuali) return 'Missed qualifying';
    if(res.qualiTimeStr) return res.qualiTimeStr + (res.qualiGapStr ? (' - '+res.qualiGapStr) : '');
    return res.qualiGapStr || 'Not captured';
  }

  /* ===================== DERIVED STATS ===================== */
  function computeStats(){
    var completed = completedRaces();
    var roundsRun = completed.length;
    var stats = {};
    DRIVERS.forEach(function(d){
      var racePoints=0, bonusPoints=0, bestGrid=null, bestGridRace=null, racesDone=0, bestFinishRank=Infinity, races=[];
      var finishedCount=0, retiredCount=0, winCount=0, p2Count=0, p3Count=0, poleCount=0, finishPositions=[];
      var lastLapRace=null, lastLapRes=null, series=[], cum=0;
      completed.forEach(function(r){
        var res = r.results[d.id];
        if(res){
          racesDone++;
          racePoints += res.points||0;
          cum += res.points||0;
          if(res.status==='retired') retiredCount++; else finishedCount++;
          if(res.finishPos===1) winCount++;
          if(res.finishPos===2) p2Count++;
          if(res.finishPos===3) p3Count++;
          if(res.qualiPos===1) poleCount++;
          if(res.finishPos!=null) finishPositions.push(res.finishPos);
          if(res.grid!=null && (bestGrid===null || res.grid<bestGrid)){ bestGrid=res.grid; bestGridRace=r; }
          if(res.bestLap!=null){ lastLapRace=r; lastLapRes=res; }
          var rank = (res.finishPos!=null) ? res.finishPos : Infinity;
          if(rank < bestFinishRank) bestFinishRank = rank;
          races.push({ round:r.round, name:r.name, res:res });
        }
        ADJUSTMENTS.forEach(function(a){ if(a.driver===d.id && a.round===r.round){ bonusPoints += a.points; cum += a.points; } });
        series.push(cum);
      });
      var totalPoints = racePoints + bonusPoints;
      // pace counts every round run: a round someone skipped is a round that scored nothing
      var pace = roundsRun>0 ? racePoints/roundsRun : 0;
      var avgFinish=null, stdevFinish=null;
      if(finishPositions.length>0){
        avgFinish = finishPositions.reduce(function(a,b){return a+b;},0)/finishPositions.length;
        if(finishPositions.length>1){
          var variance = finishPositions.reduce(function(a,v){return a+Math.pow(v-avgFinish,2);},0)/finishPositions.length;
          stdevFinish = Math.sqrt(variance);
        }
      }
      var lastLap = null;
      if(lastLapRace){
        var fl = fastestLapIn(lastLapRace);
        lastLap = { str:lastLapRes.bestLapStr, raceName:lastLapRace.name, tag:roundTag(lastLapRace), isFastest: !!(fl && fl.id===d.id) };
      }
      var bestGridInfo = null;
      if(bestGridRace){
        var bgr = bestGridRace.results[d.id];
        bestGridInfo = { raceName:bestGridRace.name, tag:roundTag(bestGridRace), timeStr:bgr.qualiTimeStr||null };
      }
      stats[d.id] = {
        totalPoints:totalPoints, racePoints:racePoints, bonusPoints:bonusPoints, series:series,
        bestGrid:bestGrid, bestGridInfo:bestGridInfo, lastLap:lastLap, poleCount:poleCount,
        racesDone:racesDone, bestFinishRank:bestFinishRank, races:races,
        finishedCount:finishedCount, retiredCount:retiredCount,
        winCount:winCount, p2Count:p2Count, p3Count:p3Count,
        avgFinish:avgFinish, stdevFinish:stdevFinish, pace:pace,
        projectedTotal: Math.round(totalPoints + pace*(TOTAL_ROUNDS-roundsRun))
      };
    });

    // count how many completed races each driver had the fastest lap of the league in
    completed.forEach(function(r){
      var fl = fastestLapIn(r);
      if(fl) stats[fl.id].fastestLapCount = (stats[fl.id].fastestLapCount||0)+1;
    });
    DRIVERS.forEach(function(d){ stats[d.id].fastestLapCount = stats[d.id].fastestLapCount||0; });

    // standings order: points desc, then best finish rank asc (classified beats DNF), then name
    var order = DRIVERS.slice().sort(function(a,b){
      var sa=stats[a.id], sb=stats[b.id];
      if(sb.totalPoints !== sa.totalPoints) return sb.totalPoints - sa.totalPoints;
      if(sa.bestFinishRank !== sb.bestFinishRank) return sa.bestFinishRank - sb.bestFinishRank;
      return a.name.localeCompare(b.name);
    });
    order.forEach(function(d,i){ stats[d.id].position = i+1; });

    var projOrder = DRIVERS.slice().sort(function(a,b){
      var sa=stats[a.id], sb=stats[b.id];
      if(sb.projectedTotal !== sa.projectedTotal) return sb.projectedTotal - sa.projectedTotal;
      return sa.bestFinishRank - sb.bestFinishRank;
    });
    projOrder.forEach(function(d,i){ stats[d.id].projectedPosition = i+1; });

    return { stats:stats, order:order, projOrder:projOrder, racesDone: roundsRun };
  }

  function fmtLap(s){ if(s==null) return null; var m=Math.floor(s/60), sec=(s-m*60).toFixed(3); return m+':'+(sec<10?'0':'')+sec; }
  function ordinal(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ===================== CHART (shared championship progression) ===================== */
  // mode: 'sofar' | 'projected'. driverIds: array to plot.
  function animateCharts(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var paths = document.querySelectorAll('#main svg.chart path.chart-line-actual');
    paths.forEach(function(p){
      try{
        var len = p.getTotalLength();
        if(reduce){ p.removeAttribute('stroke-dasharray'); p.removeAttribute('stroke-dashoffset'); return; }
        p.style.transition = 'none';
        p.setAttribute('stroke-dasharray', len);
        p.setAttribute('stroke-dashoffset', len);
        p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)';
        setTimeout(function(){ p.setAttribute('stroke-dashoffset','0'); }, 20);
      }catch(e){}
    });
  }

  function buildChart(driverIds, mode, opts){
    opts = opts||{};
    var W=300,H=150,padL=26,padR=10,padT=10,padB=18;
    var innerW=W-padL-padR, innerH=H-padT-padB;
    var data = computeStats();
    var stats = data.stats;
    var maxY = 10;
    driverIds.forEach(function(id){
      var s = stats[id];
      maxY = Math.max(maxY, mode==='projected' ? s.projectedTotal : s.totalPoints);
    });
    maxY = Math.ceil(maxY*1.15/10)*10 || 10;
    var doneX = data.racesDone;

    function xOf(round){ return padL + (round/TOTAL_ROUNDS)*innerW; }
    function yOf(pts){ return padT + innerH - (pts/maxY)*innerH; }

    var svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
    // gridlines
    [0,0.25,0.5,0.75,1].forEach(function(f){
      var y = padT + innerH*f;
      svg += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="currentColor" stroke-opacity="0.08" stroke-width="1"/>';
    });
    // x axis labels: one per round
    for(var rr=1; rr<=TOTAL_ROUNDS; rr++){
      svg += '<text class="chart-axis-label" x="'+xOf(rr).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+rr+'</text>';
    }
    svg += '<text class="chart-axis-label" x="'+(padL-4)+'" y="'+(padT+4)+'" text-anchor="end">'+maxY+'</text>';
    svg += '<text class="chart-axis-label" x="'+(padL-4)+'" y="'+(padT+innerH)+'" text-anchor="end">0</text>';

    driverIds.forEach(function(id){
      var d = driverById[id], s = stats[id];
      var actualPts = s.totalPoints;
      // cumulative points after every round run, starting from 0 on the grid
      var dPath = 'M '+xOf(0).toFixed(1)+' '+yOf(0).toFixed(1);
      s.series.forEach(function(v,i){ dPath += ' L '+xOf(i+1).toFixed(1)+' '+yOf(v).toFixed(1); });
      svg += '<path class="chart-line-actual" d="'+dPath+'" fill="none" stroke="'+d.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      s.series.forEach(function(v,i){
        var isLast = (i===s.series.length-1);
        svg += '<circle cx="'+xOf(i+1).toFixed(1)+'" cy="'+yOf(v).toFixed(1)+'" r="'+(isLast?3.4:2.4)+'" fill="'+d.color+'"/>';
        svg += '<circle class="chart-hit" cx="'+xOf(i+1).toFixed(1)+'" cy="'+yOf(v).toFixed(1)+'" r="8" fill="transparent" data-round="'+(i+1)+'" data-points="'+v+'" data-driver="'+esc(d.name)+'" data-kind="Actual"/>';
      });
      var x1=xOf(doneX), y1=yOf(actualPts);
      if(mode==='projected' && s.projectedTotal>actualPts){
        var x2=xOf(TOTAL_ROUNDS), y2=yOf(s.projectedTotal);
        svg += '<path d="M '+x1.toFixed(1)+' '+y1.toFixed(1)+' L '+x2.toFixed(1)+' '+y2.toFixed(1)+'" fill="none" stroke="'+d.color+'" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" opacity="0.85"/>';
        svg += '<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="3.2" fill="'+d.color+'" fill-opacity="0.35" stroke="'+d.color+'" stroke-width="1.5"/>';
        svg += '<circle class="chart-hit" cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="9" fill="transparent" data-round="'+TOTAL_ROUNDS+'" data-points="'+s.projectedTotal+'" data-driver="'+esc(d.name)+'" data-kind="Projected"/>';
      }
    });
    svg += '</svg>';
    return '<div class="chart-wrap">'+svg+'</div>';
  }

  /* ===================== STATE ===================== */
  var currentUser = null;

  // The round the per-circuit cards (times, grid, podium) are showing. Defaults to the latest
  // round that has timing for at least two of you, so a sparse sprint doesn't hide a full weekend.
  function raceForDetail(){
    var done = completedRaces();
    if(!done.length) return null;
    if(detailRoundNum!=null){
      var picked = done.find(function(r){ return r.round===detailRoundNum; });
      if(picked) return picked;
    }
    for(var i=done.length-1; i>=0; i--){
      var withTimes = DRIVERS.filter(function(d){ var r=resultFor(done[i], d.id); return r && (r.qualiTime!=null || r.bestLap!=null); }).length;
      if(withTimes>=2) return done[i];
    }
    return done[done.length-1];
  }
  function renderRoundPicker(){
    var current = raceForDetail();
    if(!current) return '';
    var chips = completedRaces().map(function(r){
      return '<button type="button" class="round-pick'+(r.round===current.round?' active':'')+'" data-round="'+r.round+'">'+esc(roundTag(r))+'</button>';
    }).join('');
    return '<div class="round-picker" role="group" aria-label="Choose a round"><span class="round-picker-label">Round</span>'+chips+'</div>';
  }

    if(lc){ var parsed = JSON.parse(lc); if(Array.isArray(parsed) && parsed.length===TOTAL_ROUNDS) calendar = parsed; }

  /* ===================== DB / SEASON CALENDAR ===================== */
  function initDb(){
    try{
      if(!window.claude || !window.claude.use) return renderCountdown();
      window.claude.use('db').then(function(db){
        if(!db) return renderCountdown();
        dbApi = db;
        calendarRef = db.doc('season/calendar');
        calendarRef.onSnapshot(function(snap){
          var data = snap.exists ? snap.data() : null;
          if(data && Array.isArray(data.rounds) && data.rounds.length===TOTAL_ROUNDS){ calendar = data.rounds; }
          renderCountdown();
          if(activeTab==='calendar' || activeTab==='admin') renderMain();
        }, function(){ renderCountdown(); });
      }).catch(function(){ renderCountdown(); });
    }catch(e){ renderCountdown(); }
  }

  function saveCalendar(rounds){
    if(calendarRef){
      return calendarRef.set({ rounds: rounds });
    }
    calendar = rounds;
    try{ localStorage.setItem('pp_calendar', JSON.stringify(rounds)); }catch(e){}
    renderCountdown();
    return Promise.resolve();
  }

  var cdInterval = null;
  function renderCountdown(){
    var nextIdx = computeStats().racesDone; // 0-based index of the next round to run
    var next = calendar[nextIdx] || { name:'Season Complete', date:null };
    document.getElementById('cd-race').textContent = next.name || ('Round '+(nextIdx+1));
    var timeEl = document.getElementById('cd-time');
    if(cdInterval) clearInterval(cdInterval);
    if(nextIdx >= TOTAL_ROUNDS){ timeEl.textContent = 'Season Complete'; return; }
    if(!next.date){ timeEl.textContent = 'Date TBD'; return; }
    function tick(){
      var diff = new Date(next.date).getTime() - Date.now();
      if(diff<=0){ timeEl.textContent = 'LIGHTS OUT'; clearInterval(cdInterval); return; }
      var d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000), m=Math.floor(diff%3600000/60000);
      timeEl.textContent = d+'d '+h+'h '+m+'m';
    }
    tick();
    cdInterval = setInterval(tick, 60000);
  }

  /* ===================== SOUND ENGINE (synthesized, no audio files) ===================== */
  var soundOn = true;
  try{ var savedSound = localStorage.getItem('pp_sound'); if(savedSound==='off') soundOn=false; }catch(e){}
  var audioCtx = null;
  function ensureAudio(){
    if(!soundOn) return null;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function tone(ctx, freq, startAt, dur, opts){
    opts = opts||{};
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = opts.type||'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime+startAt);
    var peak = opts.gain!=null ? opts.gain : 0.11;
    gain.gain.setValueAtTime(0, ctx.currentTime+startAt);
    gain.gain.linearRampToValueAtTime(peak, ctx.currentTime+startAt+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0005, ctx.currentTime+startAt+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime+startAt);
    osc.stop(ctx.currentTime+startAt+dur+0.02);
  }
  function playLightsOut(){
    var ctx = ensureAudio(); if(!ctx) return;
    [0,0.16,0.32,0.48,0.64].forEach(function(t){ tone(ctx, 520, t, 0.12, {type:'square', gain:0.09}); });
    tone(ctx, 300, 0.88, 0.4, {type:'sawtooth', gain:0.13});
  }
  function playPodiumChime(){
    var ctx = ensureAudio(); if(!ctx) return;
    [523.25,659.25,783.99].forEach(function(f,i){ tone(ctx, f, i*0.1, 0.35, {type:'triangle', gain:0.1}); });
  }
  function playClick(){
    var ctx = ensureAudio(); if(!ctx) return;
    tone(ctx, 720, 0, 0.05, {type:'square', gain:0.045});
  }
  function playError(){
    var ctx = ensureAudio(); if(!ctx) return;
    tone(ctx, 160, 0, 0.22, {type:'sawtooth', gain:0.09});
    tone(ctx, 120, 0.1, 0.22, {type:'sawtooth', gain:0.09});
  }
  function playSaveSuccess(){
    var ctx = ensureAudio(); if(!ctx) return;
    tone(ctx, 587.33, 0, 0.16, {type:'sine', gain:0.09});
    tone(ctx, 880, 0.1, 0.28, {type:'sine', gain:0.09});
  }
  function applySoundIcon(){
    var onPath = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/>';
    var offPath = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6" stroke="var(--danger)"/>';
    document.getElementById('sound-icon').innerHTML = soundOn ? onPath : offPath;

  /* ===================== CONFETTI ===================== */
  var confettiShownFor = null;
  function fireConfetti(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) return;
    var layer = document.getElementById('confetti-layer');
    var colors = DRIVERS.map(function(d){return d.color;}).concat(['#f2c14e','#ffffff']);
    for(var i=0;i<26;i++){
      var el = document.createElement('div');
      el.className='confetti-piece';
      el.style.left = (Math.random()*100)+'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (2.2+Math.random()*1.4)+'s';
      el.style.animationDelay = (Math.random()*0.5)+'s';
      el.style.borderRadius = (Math.random()>0.5)?'2px':'50%';
      layer.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 4200); })(el);
    }
  }

  /* ===================== RACE HIGHLIGHTS ===================== */
  function computeHighlights(race){
    var winner=null, pole=null, fastestLap=null, retirements=[], missed=[], absent=[];
    DRIVERS.forEach(function(d){
      var r = resultFor(race, d.id);
      if(!r){ absent.push(d); return; }
      if(r.finishPos===1) winner = {d:d,r:r};
      if(r.qualiPos===1 && r.qualiTimeStr) pole = {d:d,r:r};
      if(r.status==='retired') retirements.push({d:d,r:r});
      if(r.missedQuali===true) missed.push({d:d,r:r});
      if(r.bestLap!=null && (fastestLap===null || r.bestLap<fastestLap.r.bestLap)) fastestLap={d:d,r:r};
    });
    return { winner:winner, pole:pole, fastestLap:fastestLap, retirements:retirements, missed:missed, absent:absent };
  }
  function renderHighlights(race){
    var h = computeHighlights(race);
    var rows='';
    var label = race.type==='sprint' ? 'Sprint Winner' : 'Race Winner';
    if(h.winner) rows += highlightRow('&#127942;', label, esc(h.winner.d.name)+' &middot; +'+h.winner.r.points+' pts');
    if(h.pole) rows += highlightRow('&#127937;', 'Pole Position', esc(h.pole.d.name)+' &middot; '+esc(h.pole.r.qualiTimeStr));
    if(h.fastestLap) rows += highlightRow('&#9889;', 'Fastest Lap', esc(h.fastestLap.d.name)+' &middot; '+esc(h.fastestLap.r.bestLapStr));
    h.retirements.forEach(function(x){ rows += highlightRow('&#128295;', 'Retirement', esc(x.d.name)+' did not finish'); });
    h.missed.forEach(function(x){ rows += highlightRow('&#128683;', 'Missed Qualifying', esc(x.d.name)+' missed qualifying'); });
    h.absent.forEach(function(d){ rows += highlightRow('&#128164;', 'Did Not Take Part', esc(d.name)); });
    if(!rows) rows = highlightRow('&#127937;','Highlights','Nothing notable recorded yet');
    return '<div class="card"><h2>'+esc(race.name)+' Highlights</h2>'+rows+'</div>';
  }
  function highlightRow(icon,label,val){
    return '<div class="highlight-row"><div class="highlight-icon">'+icon+'</div>'+
      '<div class="highlight-text"><div class="h-label">'+esc(label)+'</div><div class="h-val">'+val+'</div></div></div>';
  }

  /* ===================== BREAKING NEWS TICKER ===================== */
  function computeNewsHeadlines(){
    var data = computeStats();
    var lines = [];
    var leader = data.order[0];
    var second = data.order[1];
    lines.push(leader.name+' leads the championship with '+data.stats[leader.id].totalPoints+' points');
    if(second){
      var gap = data.stats[leader.id].totalPoints - data.stats[second.id].totalPoints;
      if(gap>0) lines.push(second.name+' is '+gap+' point'+(gap===1?'':'s')+' behind in P2');
    }
    // newest two rounds first, so a sparse sprint does not push a full weekend off the ticker
    completedRaces().slice(-2).reverse().forEach(function(race){
      var h = computeHighlights(race);
      if(h.winner) lines.push(h.winner.d.name+' won the '+race.name);
      if(h.pole) lines.push(h.pole.d.name+' took pole for the '+race.name+' at '+h.pole.r.qualiTimeStr);
      if(h.fastestLap) lines.push(h.fastestLap.d.name+' set the fastest lap of the '+race.name+' at '+h.fastestLap.r.bestLapStr);
      h.retirements.forEach(function(x){ lines.push(x.d.name+' retired from the '+race.name); });
    });
    var nextRound = calendar[data.racesDone];
    if(nextRound) lines.push('Next up: '+nextRound.name+(nextRound.date?'':' — date TBD'));
    return lines;
  }
  var newsInterval=null, newsIdx=0;
  function initNewsTicker(){
    if(newsInterval){ clearInterval(newsInterval); newsInterval=null; }
    var el = document.getElementById('news-text');
    if(!el) return;
    var lines = computeNewsHeadlines();
    if(lines.length===0) return;
    newsIdx = 0;
    el.textContent = lines[0];
    if(lines.length<2) return;
    newsInterval = setInterval(function(){
      el.style.opacity = 0;
      setTimeout(function(){
        newsIdx = (newsIdx+1) % lines.length;
        el.textContent = lines[newsIdx];
        el.style.opacity = 1;
      }, 300);
    }, 4200);
  }

  function goToTabByOffset(dir){

  (function initSwipe(){
    var main = document.getElementById('main');
    var sx=0, sy=0, sTarget=null, tracking=false;
    main.addEventListener('touchstart', function(e){
      if(e.touches.length!==1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; sTarget = e.target; tracking = true;
    }, {passive:true});
    main.addEventListener('touchend', function(e){
      if(!tracking) return; tracking=false;
      var t = e.changedTouches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.4) return;
      if(sTarget && sTarget.closest && sTarget.closest('.tbl-wrap, select, input, .mode-toggle')) return;
      goToTabByOffset(dx < 0 ? 1 : -1);
    }, {passive:true});
  })();

    if(seen) return;
    var hint = document.getElementById('swipe-hint');

  /* ===================== LATEST RESULTS POP-UP ===================== */
  // Shown once per person per new result (remembered on that device). A brand-new device
  // sees the latest results too, because nothing has been marked as seen yet.
  var rpQueue = [], rpIndex = 0, rpLastFocus = null;
  function rpSeenKey(uid){ return 'pp_seen_'+uid; }
  function rpGetSeen(uid){ try{ var v = localStorage.getItem(rpSeenKey(uid)); return v==null ? 0 : (parseInt(v,10)||0); }catch(e){ return 0; } }
  function rpSetSeen(uid, n){ try{ localStorage.setItem(rpSeenKey(uid), String(n)); }catch(e){} }
  function rpUnseen(uid){
    var seen = rpGetSeen(uid);
    return completedRaces().filter(function(r){ return r.round > seen; });
  }

  function recapHtml(race, uid){
    var h = computeHighlights(race);
    var kind = race.type==='sprint' ? 'Sprint' : 'Race';
    var ranked = DRIVERS.filter(function(d){ return resultFor(race, d.id); }).sort(function(a,b){
      var ra=resultFor(race,a.id), rb=resultFor(race,b.id);
      var pa = ra.finishPos!=null ? ra.finishPos : 999, pb = rb.finishPos!=null ? rb.finishPos : 999;
      if(pa!==pb) return pa-pb;
      return (rb.points||0)-(ra.points||0);
    });

    var banner = '';
    if(h.winner){
      banner = '<div class="rp-winner" style="--team:'+h.winner.d.color+'">'+
        '<div class="rp-win-kicker">'+kind+' winner</div>'+
        '<div class="rp-win-name">'+esc(h.winner.d.name)+'</div>'+
        '<div class="rp-win-sub">'+esc(h.winner.d.team)+' &middot; +'+h.winner.r.points+' pts</div></div>';
    }

    var rows = ranked.map(function(d, i){
      var r = resultFor(race, d.id);
      var pos = r.finishPos!=null ? ('P'+r.finishPos) : (r.status==='retired' ? 'DNF' : '&mdash;');
      var bits = [];
      if(r.finishPos==null && r.status!=='retired' && r.finishLabel) bits.push(r.finishLabel);
      if(r.grid!=null) bits.push('Grid P'+r.grid); else if(r.gridLabel) bits.push('Grid: '+r.gridLabel);
      if(r.bestLapStr) bits.push('Best lap '+r.bestLapStr);
      if(r.note) bits.push(r.note);
      var isYou = d.id===uid;
      return '<div class="rp-row'+(isYou?' you':'')+(r.status==='retired'?' dnf':'')+'" style="--i:'+i+'">'+
        '<span class="rp-pos">'+pos+'</span>'+
        '<span class="dot" style="background:'+d.color+'"></span>'+
        '<div class="rp-who"><div class="rp-name">'+esc(d.name)+(isYou?' <span class="rp-you">YOU</span>':'')+'</div>'+
        '<div class="rp-detail">'+esc(bits.join(' · '))+'</div></div>'+
        '<span class="rp-pts'+((r.points||0)>0?' scored':'')+'">'+((r.points||0)>0 ? ('+'+r.points) : '0')+'</span>'+
      '</div>';
    }).join('');

    var absentRows = h.absent.map(function(d, i){
      var isYou = d.id===uid;
      return '<div class="rp-row absent'+(isYou?' you':'')+'" style="--i:'+(ranked.length+i)+'">'+
        '<span class="rp-pos">&mdash;</span>'+
        '<span class="dot" style="background:'+d.color+'"></span>'+
        '<div class="rp-who"><div class="rp-name">'+esc(d.name)+(isYou?' <span class="rp-you">YOU</span>':'')+'</div>'+
        '<div class="rp-detail">Did not take part</div></div>'+
        '<span class="rp-pts">&ndash;</span>'+
      '</div>';
    }).join('');

    var hl = [];
    if(h.pole) hl.push('Pole: '+esc(h.pole.d.name)+' '+esc(h.pole.r.qualiTimeStr));
    if(h.fastestLap) hl.push('Fastest lap: '+esc(h.fastestLap.d.name)+' '+esc(h.fastestLap.r.bestLapStr));
    var hlHtml = hl.length ? '<div class="rp-highlights">'+hl.join(' &middot; ')+'</div>' : '';

    return '<div class="rp-kicker"><span class="rp-new">New results</span><span class="rp-round">Round '+race.round+' of '+TOTAL_ROUNDS+' &middot; '+kind+'</span></div>'+
      '<h2 class="rp-title" id="rp-title">'+esc(race.name)+'</h2>'+
      '<div class="rp-sub">'+esc(race.location)+'</div>'+
      banner+
      '<div class="rp-list">'+rows+absentRows+'</div>'+
      hlHtml;
  }

  function renderResultsPopup(){
    var race = rpQueue[rpIndex];
    var uid = currentUser;
    document.getElementById('rp-body').innerHTML = recapHtml(race, uid);
    var last = rpIndex >= rpQueue.length-1;
    var primary = document.getElementById('rp-primary');
    primary.textContent = last ? 'Close' : ('Next result ('+(rpIndex+1)+' of '+rpQueue.length+')');
    var mine = resultFor(race, uid);
    if(mine && mine.finishPos===1){ fireConfetti(); playPodiumChime(); }
    else if(mine && mine.finishPos!=null && mine.finishPos<=3){ playPodiumChime(); }
    else playClick();
  }

  function openResultsPopup(){
    rpLastFocus = document.activeElement;
    renderResultsPopup();
    document.getElementById('rp-backdrop').hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(function(){ var p = document.getElementById('rp-primary'); if(p) p.focus(); }, 60);

  function closeResultsPopup(goStandings){
    var bd = document.getElementById('rp-backdrop');
    if(bd.hidden) return;
    bd.hidden = true;
    document.body.style.overflow = '';
    var done = completedRaces();
    if(currentUser && done.length) rpSetSeen(currentUser, done[done.length-1].round);
    if(rpLastFocus && rpLastFocus.focus){ try{ rpLastFocus.focus(); }catch(e){} }
    if(goStandings && currentUser){ activeTab = 'standings'; renderTabs(); renderMain(); }
    maybeShowSwipeHint();
  }

  function maybeShowResultsPopup(){
    if(!currentUser) return false;
    var unseen = rpUnseen(currentUser);
    if(!unseen.length) return false;
    rpQueue = unseen.slice(-2).reverse();
    rpIndex = 0;
    openResultsPopup();
    return true;
  }

  (function initResultsPopup(){
    var bd = document.getElementById('rp-backdrop');
    document.getElementById('rp-close').addEventListener('click', function(){ closeResultsPopup(false); });
    document.getElementById('rp-standings').addEventListener('click', function(){ closeResultsPopup(true); });
    document.getElementById('rp-primary').addEventListener('click', function(){
      if(rpIndex < rpQueue.length-1){ rpIndex++; renderResultsPopup(); var c=document.querySelector('.rp-card'); if(c) c.scrollTop=0; }
      else closeResultsPopup(false);
    });
    bd.addEventListener('click', function(e){ if(e.target===bd) closeResultsPopup(false); });
    document.addEventListener('keydown', function(e){
      if(bd.hidden) return;
      if(e.key==='Escape'){ closeResultsPopup(false); return; }
      if(e.key==='Tab'){
        var f = bd.querySelectorAll('button');
        if(!f.length) return;
        var first=f[0], lastEl=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); lastEl.focus(); }
        else if(!e.shiftKey && document.activeElement===lastEl){ e.preventDefault(); first.focus(); }
      }
    });
  })();

    '</div>'+
