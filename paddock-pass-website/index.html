      '<h2>'+esc(lastRace.name)+' ('+esc(lastRace.location)+') · Round '+lastRace.round+(lastRace.type==='sprint'?' · Sprint':'')+'</h2>'+
      (lastRes
        ? '<div class="race-summary">'+
            raceRow('Qualifying', qualiText(lastRes))+
            raceRow('Grid', gridText(lastRes))+
            raceRow('Finished', lastRes.finishLabel)+
            raceRow('Points scored', lastRes.points)+
            raceRow('Best lap', lastRes.bestLapStr||'Not captured')+
            raceRow('Pit stops', lastRes.stops!=null?lastRes.stops:'—')+
            raceRow('Gap / Note', lastRes.gapStr)+
          '</div>'
        : '<p class="section-sub" style="margin:0">You did not take part in this round.</p>')+
    '</div>';
  }
  function posValStr(p){ return 'P'+p; }
  function raceRow(k,v){ return '<div class="race-row"><span class="k">'+esc(k)+'</span><span class="v num">'+esc(v)+'</span></div>'; }

  function renderGapsLadder(data){
    var rows = data.order.map(function(d,i){
      var s = data.stats[d.id];
      var leaderPts = data.stats[data.order[0].id].totalPoints;
      var aheadPts = i===0 ? s.totalPoints : data.stats[data.order[i-1].id].totalPoints;
      var diffLeader = Math.max(0,leaderPts-s.totalPoints);
      var diffAhead = Math.max(0,aheadPts-s.totalPoints);
      var gapLeader = i===0 ? 'Leader' : (diffLeader===0?'0':('-'+diffLeader));
      var gapAhead = i===0 ? '—' : (diffAhead===0?'0':('-'+diffAhead));
      return '<div class="gap-row">'+
        '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div class="gap-vals">'+
          '<div><span class="gv-label">Pts</span><b class="num">'+s.totalPoints+'</b></div>'+
          '<div><span class="gv-label">To Ahead</span><b class="num">'+gapAhead+'</b></div>'+
          '<div><span class="gv-label">To Leader</span><b class="num">'+gapLeader+'</b></div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Championship Gaps</h2>'+rows+'</div>';
  }

  // Gap to the real pole time, as the game shows it (pole is not always one of you).
  function renderQualiGaps(race){
    var withGap = DRIVERS.filter(function(d){ var r=resultFor(race,d.id); return r && r.qualiGap!=null; })
      .sort(function(a,b){ return resultFor(race,a.id).qualiGap - resultFor(race,b.id).qualiGap; });
    var others = DRIVERS.filter(function(d){ var r=resultFor(race,d.id); return !(r && r.qualiGap!=null); });
    var maxGap = 0.001;
    withGap.forEach(function(d){ maxGap = Math.max(maxGap, resultFor(race,d.id).qualiGap); });
    var rows = withGap.map(function(d){
      var gap = resultFor(race,d.id).qualiGap;
      var pct = gap===0 ? 4 : Math.max(6, Math.round((gap/maxGap)*100));
      var valStr = gap===0 ? 'POLE' : ('+'+gap.toFixed(3)+'s');
      return '<div class="bar-row">'+
        '<div class="bar-label">'+esc(d.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+d.color+'"></div></div>'+
        '<div class="bar-val num" style="width:auto;min-width:64px">'+valStr+'</div>'+
      '</div>';
    }).join('');
    var naRows = others.map(function(d){
      var r = resultFor(race,d.id);
      var why = !r ? 'Did not take part' : (r.missedQuali ? 'Missed quali' : 'Not captured');
      return '<div class="bar-row">'+
        '<div class="bar-label">'+esc(d.name)+'</div>'+
        '<div class="bar-track"></div>'+
        '<div class="bar-val" style="width:auto;min-width:64px;color:var(--text-dim);font-size:11px">'+why+'</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Qualifying Gap to Pole &mdash; '+esc(roundTag(race))+'</h2>'+rows+naRows+'</div>';
  }

  function renderReliability(data){
    var rows = data.order.map(function(d){
      var s = data.stats[d.id];
      var total = s.racesDone||1;
      var finPct = Math.round((s.finishedCount/total)*100);
      var retPct = 100-finPct;
      return '<div class="reliab-row">'+
        '<div class="driver-cell" style="width:92px;flex:none"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div class="reliab-bar"><div class="seg-fin" style="width:'+finPct+'%"></div><div class="seg-ret" style="width:'+retPct+'%"></div></div>'+
        '<div class="num" style="font-size:11.5px;color:var(--text-dim);white-space:nowrap">'+s.finishedCount+'/'+total+' finished</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Reliability</h2>'+rows+'</div>';
  }

  function renderPodiumTally(data){
    var rows = data.order.map(function(d){
      var s = data.stats[d.id];
      return '<div class="gap-row">'+
        '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div class="gap-vals">'+
          '<div><span class="gv-label">Wins</span><span class="chip chip-gold num">'+s.winCount+'</span></div>'+
          '<div><span class="gv-label">P2s</span><span class="chip chip-silver num">'+s.p2Count+'</span></div>'+
          '<div><span class="gv-label">P3s</span><span class="chip chip-bronze num">'+s.p3Count+'</span></div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Podium Tally</h2>'+rows+'</div>';
  }

  // Gap between friends in qualifying. The car directly ahead is often an AI driver,
  // so this is "the next friend ahead", measured from the times we have.
  function renderQualiGapsToAhead(race){
    var withTime = DRIVERS.filter(function(d){ var r=resultFor(race,d.id); return r && r.qualiTime!=null; })
      .sort(function(a,b){ return resultFor(race,a.id).qualiTime - resultFor(race,b.id).qualiTime; });
    if(withTime.length<2){
      return '<div class="card"><h2>Gap to the Friend Ahead &mdash; '+esc(roundTag(race))+'</h2>'+
        '<p class="section-sub" style="margin:0">Needs qualifying times for at least two of you in this round.</p></div>';
    }
    var maxGap = 0.001;
    var rows = withTime.map(function(d,i){
      var gap = i===0 ? 0 : (resultFor(race,d.id).qualiTime - resultFor(race,withTime[i-1].id).qualiTime);
      maxGap = Math.max(maxGap, gap);
      return {d:d, gap:gap};
    });
    var html = rows.map(function(r,i){
      var pct = r.gap===0 ? 4 : Math.max(6, Math.round((r.gap/maxGap)*100));
      var valStr = i===0 ? 'FASTEST' : ('+'+r.gap.toFixed(3)+'s');
      return '<div class="bar-row">'+
        '<div class="bar-label">'+esc(r.d.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+r.d.color+'"></div></div>'+
        '<div class="bar-val num" style="width:auto;min-width:64px">'+valStr+'</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Gap to the Friend Ahead &mdash; '+esc(roundTag(race))+'</h2>'+html+'</div>';
  }

  function renderGridDeltas(race){
    var rows = DRIVERS.map(function(d){
      var res = resultFor(race, d.id);
      if(!res){
        return '<div class="gap-row">'+
          '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
          '<div class="gap-vals" style="color:var(--text-dim);font-size:12px;font-weight:600">Did not take part</div>'+
        '</div>';
      }
      var chip;
      if(res.grid==null || res.finishPos==null){
        chip = '<span class="chip chip-na">N/A</span>';
      } else {
        var delta = res.grid - res.finishPos;
        if(delta>0) chip = '<span class="chip chip-pb">+'+delta+'</span>';
        else if(delta<0) chip = '<span class="chip" style="background:color-mix(in srgb, var(--danger) 18%, transparent);color:var(--danger)">'+delta+'</span>';
        else chip = '<span class="chip chip-na">±0</span>';
      }
      var startStr = gridText(res);
      var endStr = res.finishLabel ? res.finishLabel.split(' - ')[0] : 'N/A';
      return '<div class="gap-row">'+
        '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div class="gap-vals">'+
          '<div><span class="gv-label">Started</span><b class="num">'+esc(startStr)+'</b></div>'+
          '<div><span class="gv-label">Finished</span><b class="num">'+esc(endStr)+'</b></div>'+
          '<div><span class="gv-label">Change</span>'+chip+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Grid vs Finish &mdash; '+esc(race.name)+'</h2>'+rows+'</div>';
  }

  function secNum(s){ var n = parseFloat(s); return isNaN(n) ? null : n; }
  function lapSecs(str){ var p = String(str).split(':'); return parseInt(p[0],10)*60 + parseFloat(p[1]); }

  // Each qualifying session as photographed. Only the screens we have are shown, so a driver who
  // isn't listed in a session was not captured there (not "had no time"). The quickest sector
  // in each column is highlighted, among the friends in that session only.
  function renderQualiSessions(race){
    if(!race.qualifying || !race.qualifying.sessions || !race.qualifying.sessions.length) return '';
    var blocks = race.qualifying.sessions.map(function(s){
      var listed = DRIVERS.filter(function(d){ return s.rows[d.id]; })
        .sort(function(a,b){ return s.rows[a.id].pos - s.rows[b.id].pos; });
      var best = { s1:null, s2:null, s3:null };
      listed.forEach(function(d){
        ['s1','s2','s3'].forEach(function(k){
          var v = secNum(s.rows[d.id][k]);
          if(v!=null && (best[k]===null || v<best[k])) best[k] = v;
        });
      });
      var hasSectors = best.s1!=null;
      var head = '<th>Driver</th><th>Pos</th><th>Time</th><th>Gap</th>'+(hasSectors ? '<th>S1</th><th>S2</th><th>S3</th><th>Laps</th>' : '');
      var body = listed.map(function(d){
        var r = s.rows[d.id];
        function sec(k){
          var v = secNum(r[k]);
          if(v==null) return '<td class="num"><span style="color:var(--text-dim)">&mdash;</span></td>';
          var isBest = listed.length>1 && v===best[k];
          return '<td class="num"'+(isBest ? ' style="color:var(--fastest);font-weight:800"' : '')+'>'+esc(r[k])+'</td>';
        }
        return '<tr><td><div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div></td>'+
          '<td class="num">P'+r.pos+'</td>'+
          '<td class="num">'+esc(r.time)+'</td>'+
          '<td class="num">'+(r.gap ? esc(r.gap) : '<span style="color:var(--text-dim)">&mdash;</span>')+'</td>'+
          (hasSectors ? (sec('s1')+sec('s2')+sec('s3')+'<td class="num">'+(r.laps!=null ? r.laps : '&mdash;')+(r.tyre ? ' <span class="tyre-chip tyre-'+r.tyre+'" title="Soft tyre" style="margin-left:4px">'+r.tyre+'</span>' : '')+'</td>') : '')+
        '</tr>';
      }).join('');

      var notes = [];
      if(hasSectors && listed.length>=2){
        var kings = ['s1','s2','s3'].map(function(k,i){
          var who = listed.find(function(d){ return secNum(s.rows[d.id][k])===best[k]; });
          return 'S'+(i+1)+' '+esc(who.name)+' '+best[k].toFixed(3);
        });
        notes.push('Quickest sectors: '+kings.join(' &middot; '));
        var combined = best.s1+best.s2+best.s3;
        var fastestActual = Math.min.apply(null, listed.map(function(d){ return lapSecs(s.rows[d.id].time); }));
        notes.push('Your best sectors combined: '+fmtLap(combined)+' &middot; quickest actual lap: '+fmtLap(fastestActual));
      }
      if(s.theoreticalBest) notes.push('Session theoretical best (all 20 cars): '+esc(s.theoreticalBest));
      if(s.poleTime) notes.push('Pole lap: '+esc(s.poleTime)+' (worked out from the gaps shown)');
      if(s.conditions) notes.push(esc(s.conditions));

      return '<div class="qs-block"><div class="qs-head"><b>'+esc(s.label)+'</b><span>'+esc(s.note)+'</span></div>'+
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
        (notes.length ? '<div class="qs-notes">'+notes.map(function(n){ return '<div>'+n+'</div>'; }).join('')+'</div>' : '')+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Qualifying Sessions &mdash; '+esc(roundTag(race))+'</h2>'+blocks+'</div>';
  }

  function renderConsistency(data){
    var rows = data.order.map(function(d){
      var s = data.stats[d.id];
      var avgStr = s.avgFinish!=null ? ('P'+s.avgFinish.toFixed(1)) : 'N/A';
      var stdevStr = s.stdevFinish!=null ? ('&plusmn;'+s.stdevFinish.toFixed(1)) : 'Need 2+ races';
      return '<div class="gap-row">'+
        '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div class="gap-vals">'+
          '<div><span class="gv-label">Avg Finish</span><b class="num">'+avgStr+'</b></div>'+
          '<div><span class="gv-label">Consistency</span><b class="num">'+stdevStr+'</b></div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Consistency</h2>'+rows+'</div>';
  }

  function renderPace(data){
    var order = DRIVERS.slice().sort(function(a,b){ return data.stats[b.id].pace - data.stats[a.id].pace; });
    var rows = order.map(function(d){
      var s = data.stats[d.id];
      return '<div class="gap-row">'+
        '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div class="gap-vals">'+
          '<div><span class="gv-label">Pts / Round</span><b class="num">'+s.pace.toFixed(1)+'</b></div>'+
          '<div><span class="gv-label">Over Season</span><b class="num">'+s.projectedTotal+'</b></div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Scoring Pace</h2>'+rows+
      '<p class="section-sub" style="margin:10px 0 0">Race points only, averaged over every round run &mdash; a round someone skipped counts as a zero. Bonus points are not extrapolated.</p></div>';
  }

  function renderQualiH2H(data){
    var completedRaces = RACES.filter(function(r){ return r.completed; });
    var rows = '';
    for(var i=0;i<DRIVERS.length;i++){
      for(var j=i+1;j<DRIVERS.length;j++){
        var a=DRIVERS[i], b=DRIVERS[j];
        var aWins=0, bWins=0, compared=0;
        completedRaces.forEach(function(race){
          var ra=race.results[a.id], rb=race.results[b.id];
          if(ra && rb && ra.qualiTime!=null && rb.qualiTime!=null){
            compared++;
            if(ra.qualiTime<rb.qualiTime) aWins++; else if(rb.qualiTime<ra.qualiTime) bWins++;
          }
        });
        if(compared===0) continue;
        rows += '<div class="h2h-row" style="grid-template-columns:1fr 70px 1fr">'+
          '<div class="h2h-val left" style="color:'+a.color+'">'+esc(a.name)+'</div>'+
          '<div class="metric num" style="font-weight:800;color:var(--text)">'+aWins+' - '+bWins+'</div>'+
          '<div class="h2h-val right" style="color:'+b.color+'">'+esc(b.name)+'</div>'+
        '</div>';
      }
    }
    if(!rows) rows = '<p class="section-sub">Not enough qualifying data to compare yet.</p>';
    return '<div class="card"><h2>Head-to-Head Qualifying</h2>'+rows+'</div>';
  }

  function renderPointsBreakdown(data){
    var completedRaces = RACES.filter(function(r){ return r.completed; });
    var rows = data.order.map(function(d){
      var map = {};
      completedRaces.forEach(function(race){
        var r = race.results[d.id];
        if(r && r.finishPos!=null){
          if(!map[r.finishPos]) map[r.finishPos] = {points:0,count:0};
          map[r.finishPos].points += r.points||0;
          map[r.finishPos].count++;
        }
      });
      var keys = Object.keys(map).map(Number).sort(function(a,b){return a-b;});
      var parts = keys.map(function(k){ return 'P'+k+': '+map[k].points+'pt'+(map[k].points===1?'':'s')+' ('+map[k].count+'x)'; });
      var bonus = data.stats[d.id].bonusPoints;
      if(bonus) parts.push('Bonus: +'+bonus);
      var breakdown = parts.length ? parts.join(' &middot; ') : 'No classified finish yet';
      return '<div class="gap-row">'+
        '<div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>'+
        '<div style="flex:1;text-align:right;font-size:12px;color:var(--text-dim);font-weight:600">'+breakdown+'</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>Points-Scoring Breakdown</h2>'+rows+'</div>';
  }

  function renderStats(){
    var data = computeStats();
    var race = raceForDetail();
    return ''+
    '<div class="page-head">'+
      '<div><h2 class="section-title">Stats</h2>'+
      '<p class="section-sub">Deep-dive numbers &middot; times are per circuit</p></div>'+
      '<span class="round-chip">ROUND '+data.racesDone+' / '+TOTAL_ROUNDS+'</span>'+
    '</div>'+
    renderPace(data)+
    renderPointsBreakdown(data)+
    renderQualiH2H(data)+
    renderRoundPicker()+
    renderQualiSessions(race)+
    renderQualiGaps(race)+
    renderQualiGapsToAhead(race);
  }

  function priorPosition(driverId){
    var completed = RACES.filter(function(r){ return r.completed; });
    if(completed.length===0) return null;
    var lastRound = completed[completed.length-1].round;
    var priorRaces = completed.filter(function(r){ return r.round < lastRound; });
    if(priorRaces.length===0) return null;
    var totals = {};
    DRIVERS.forEach(function(d){ totals[d.id] = {points:0, bestFinishRank:Infinity}; });
    priorRaces.forEach(function(r){
      DRIVERS.forEach(function(d){
        var res = r.results[d.id];
        if(!res) return;
        totals[d.id].points += res.points||0;
        var rank = res.finishPos!=null ? res.finishPos : Infinity;
        if(rank < totals[d.id].bestFinishRank) totals[d.id].bestFinishRank = rank;
      });
    });
    ADJUSTMENTS.forEach(function(a){ if(a.round < lastRound && totals[a.driver]) totals[a.driver].points += a.points; });
    var order = DRIVERS.slice().sort(function(a,b){
      if(totals[b.id].points !== totals[a.id].points) return totals[b.id].points - totals[a.id].points;
      if(totals[a.id].bestFinishRank !== totals[b.id].bestFinishRank) return totals[a.id].bestFinishRank - totals[b.id].bestFinishRank;
      return a.name.localeCompare(b.name);
    });
    var idx = order.findIndex(function(d){ return d.id===driverId; });
    return idx===-1 ? null : idx+1;
  }
  function positionChangeHtml(driverId, currentPos){
    var prior = priorPosition(driverId);
    if(prior===null) return '<span class="pos-change new">NEW</span>';
    if(prior>currentPos) return '<span class="pos-change up">&#9650;'+(prior-currentPos)+'</span>';
    if(prior<currentPos) return '<span class="pos-change down">&#9660;'+(currentPos-prior)+'</span>';
    return '<span class="pos-change same">&ndash;</span>';
  }

  function renderPodiumReveal(race){
    var finishers = DRIVERS.filter(function(d){ return race.results[d.id] && race.results[d.id].finishPos!=null; })
      .sort(function(a,b){ return race.results[a.id].finishPos - race.results[b.id].finishPos; })
      .slice(0,3);
    if(finishers.length<1) return '';
    var slotClass = ['s1','s2','s3'];
    var slots = finishers.map(function(d,i){
      var res = race.results[d.id];
      return '<div class="podium-slot '+slotClass[i]+'">'+
        '<div class="p-avatar" style="background:'+d.color+'">'+esc(d.name.slice(0,2).toUpperCase())+'</div>'+
        '<div class="p-name">'+esc(d.name)+'</div>'+
        '<div class="p-pts">'+res.points+' pts</div>'+
        '<div class="p-note">Finished P'+res.finishPos+'</div>'+
        '<div class="p-step">'+(i+1)+'</div>'+
      '</div>';
    }).join('');
    return '<div class="card"><h2>League Podium &mdash; '+esc(race.name)+'</h2>'+
      '<p class="section-sub" style="margin:-6px 0 4px">Best-placed finishers among the 5 of you (real race position shown below each)</p>'+
      '<div class="podium-reveal">'+slots+'</div>'+
    '</div>';
  }

  function renderStandings(){
    var data = computeStats();
    var race = raceForDetail();
    var fl = fastestLapIn(race);
    var rows = data.order.map(function(d){
      var s = data.stats[d.id];
      var res = resultFor(race, d.id);
      var dash = '<span style="color:var(--text-dim)">&mdash;</span>';
      var gridCell = res ? esc(gridText(res)) : dash;
      var qualiCell = (res && res.qualiTimeStr)
        ? esc(res.qualiTimeStr)+(res.qualiPos===1 ? ' <span class="chip chip-fastest" style="margin-left:4px">Pole</span>' : '')
        : dash;
      var lapCell = (res && res.bestLapStr)
        ? esc(res.bestLapStr)+((fl && fl.id===d.id) ? ' <span class="chip chip-fastest" style="margin-left:4px">F</span>' : '')
        : dash;
      var ptsCell = s.totalPoints + (s.bonusPoints ? ' <span class="chip chip-na" style="margin-left:4px" title="Includes '+s.bonusPoints+' bonus points">+'+s.bonusPoints+'</span>' : '');
      return '<tr>'+
        '<td>'+posBadge(s.position)+'</td>'+
        '<td>'+positionChangeHtml(d.id, s.position)+'</td>'+
        '<td><div class="driver-cell"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div></td>'+
        '<td class="num" style="font-weight:800">'+ptsCell+'</td>'+
        '<td class="num">'+gridCell+'</td>'+
        '<td class="num">'+qualiCell+'</td>'+
        '<td class="num">'+lapCell+'</td>'+
      '</tr>';
    }).join('');

    var legend = DRIVERS.map(function(d){
      return '<div class="legend-item"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+'</div>';
    }).join('');

    return ''+
    '<div class="page-head">'+
      '<div><h2 class="section-title">Championship Standings</h2>'+
      '<p class="section-sub">Official classification</p></div>'+
      '<span class="round-chip">ROUND '+data.racesDone+' / '+TOTAL_ROUNDS+'</span>'+
    '</div>'+
    renderRoundPicker()+
    renderPodiumReveal(race)+
    '<div class="card">'+
      '<div class="tbl-wrap"><table class="tbl">'+
        '<thead><tr><th></th><th>&Delta;</th><th>Driver</th><th>Pts</th><th>Grid</th><th>Quali</th><th>Best Lap</th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
      '<p class="section-sub" style="margin:10px 0 0">Points are season totals. Grid, quali and best lap are for '+esc(race.name)+' &mdash; lap times can only be compared within one circuit.</p>'+
    '</div>'+
    renderGapsLadder(data)+
    renderPodiumTally(data)+
    renderGridDeltas(race)+
    renderConsistency(data)+
    renderReliability(data)+
    '<div class="card">'+
      '<h2>Points Progression</h2>'+
      '<div class="mode-toggle" id="standings-mode-toggle" style="width:max-content;margin-bottom:10px">'+
        '<button data-mode="sofar" class="'+(chartMode==='sofar'?'active':'')+'">SO FAR</button>'+
        '<button data-mode="projected" class="'+(chartMode==='projected'?'active':'')+'">PROJECTED</button>'+
      '</div>'+
      buildChart(DRIVERS.map(function(d){return d.id;}), chartMode)+
      '<div class="legend">'+legend+'</div>'+
    '</div>'+
    renderHighlights(race);
  }

  function computeTeamStandings(data){
    var teams = {};
    DRIVERS.forEach(function(d){
      var s = data.stats[d.id];
      if(!teams[d.team]) teams[d.team] = { name:d.team, color:d.color, textOnColor:d.textOnColor, drivers:[], totalPoints:0, bestFinishRank:Infinity };
      var t = teams[d.team];
      t.drivers.push({ d:d, points:s.totalPoints });
      t.totalPoints += s.totalPoints;
      if(s.bestFinishRank < t.bestFinishRank) t.bestFinishRank = s.bestFinishRank;
    });
    var list = Object.keys(teams).map(function(k){ return teams[k]; });
    list.sort(function(a,b){
      if(b.totalPoints!==a.totalPoints) return b.totalPoints-a.totalPoints;
      if(a.bestFinishRank!==b.bestFinishRank) return a.bestFinishRank-b.bestFinishRank;
      return a.name.localeCompare(b.name);
    });
    list.forEach(function(t){ t.drivers.sort(function(x,y){ return y.points-x.points; }); });
    return list;
  }

  function renderConstructors(){
    var data = computeStats();
    var teams = computeTeamStandings(data);
    var maxPts = Math.max.apply(null, teams.map(function(t){ return t.totalPoints; }).concat([1]));
    var bars = teams.map(function(t){
      var pct = Math.round((t.totalPoints/maxPts)*100);
      return '<div class="bar-row">'+
        '<div class="bar-label">'+esc(t.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+t.color+'"></div></div>'+
        '<div class="bar-val num">'+t.totalPoints+'</div>'+
      '</div>';
    }).join('');

    var rows = teams.map(function(t,i){
      var driverStr = t.drivers.map(function(x){ return esc(x.d.name)+' '+x.points; }).join(' &middot; ');
      return '<tr><td>'+posBadge(i+1)+'</td>'+
        '<td><span class="team-badge" style="background:'+t.color+';color:'+t.textOnColor+'">'+esc(t.name)+'</span></td>'+
        '<td class="wrap" style="color:var(--text-dim)">'+driverStr+'</td>'+
        '<td class="num" style="font-weight:800">'+t.totalPoints+'</td></tr>';
    }).join('');

    return ''+
    '<div>'+
      '<h2 class="section-title">Constructors</h2>'+
      '<p class="section-sub">Combined points per team</p>'+
    '</div>'+
    '<div class="card"><h2>Team Points</h2>'+bars+'</div>'+
    '<div class="card">'+
      '<div class="tbl-wrap"><table class="tbl">'+
        '<thead><tr><th></th><th>Team</th><th>Drivers</th><th>Pts</th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
    '</div>';
  }

  function renderCalendar(){
    var data = computeStats();
    var rows = calendar.map(function(c){
      var isDone = c.round <= data.racesDone;
      var isNext = c.round === data.racesDone+1;
      var raceRec = RACES.find(function(r){ return r.round===c.round && r.completed; });
      var dateStr = 'Date TBD';
      if(c.date){ try{ dateStr = new Date(c.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }catch(e){} }
      var extra = '';
      if(isDone && raceRec){
        var winnerId = Object.keys(raceRec.results).find(function(id){ return raceRec.results[id].finishPos===1; });
        if(winnerId) extra = (raceRec.type==='sprint' ? 'Sprint winner: ' : 'Winner: ')+driverById[winnerId].name;
        else if(raceRec.type==='sprint') extra = 'Sprint';
      }
      var shownName = raceRec ? raceRec.name : c.name;
      return '<div class="calendar-row'+(isDone?' done':(isNext?' next':''))+'">'+
        '<div class="calendar-num">'+(isDone?'&#10003;':'R'+c.round)+'</div>'+
        '<div class="calendar-info"><div class="c-name">'+esc(shownName)+'</div><div class="c-date">'+(isDone?(extra||'Completed'):dateStr)+'</div></div>'+
        '<span class="calendar-tag'+(isDone?' done':(isNext?' next':''))+'">'+(isDone?'Done':(isNext?'Next':'Upcoming'))+'</span>'+
      '</div>';
    }).join('');

    return ''+
    '<div class="page-head">'+
      '<div><h2 class="section-title">Season Calendar</h2>'+
      '<p class="section-sub">12 rounds &middot; Season 1</p></div>'+
      '<span class="round-chip">ROUND '+data.racesDone+' / '+TOTAL_ROUNDS+'</span>'+
    '</div>'+
    '<div class="card">'+rows+'</div>';
  }

  var h2hSel = { a:null, b:null };
  function renderH2H(){
    var others = DRIVERS.filter(function(d){ return d.id!==currentUser; });
    var selA = (h2hSel.a && driverById[h2hSel.a]) ? h2hSel.a : currentUser;
    var defaultB = (h2hSel.b && driverById[h2hSel.b]) ? h2hSel.b : (others[0] ? others[0].id : DRIVERS[0].id);
    return ''+
    '<div>'+
      '<h2 class="section-title">Head-to-Head</h2>'+
      '<p class="section-sub">Pick two drivers to compare</p>'+
    '</div>'+
    renderRoundPicker()+
    '<div class="card">'+
      '<div class="h2h-pickers">'+
        '<select class="sel" id="h2h-a">'+DRIVERS.map(function(d){ return '<option value="'+d.id+'"'+(d.id===selA?' selected':'')+'>'+esc(d.name)+'</option>'; }).join('')+'</select>'+
        '<span class="h2h-vs">VS</span>'+
        '<select class="sel" id="h2h-b">'+DRIVERS.map(function(d){ return '<option value="'+d.id+'"'+(d.id===defaultB?' selected':'')+'>'+esc(d.name)+'</option>'; }).join('')+'</select>'+
      '</div>'+
      '<div id="h2h-body"></div>'+
    '</div>';
  }

  function renderH2HBody(idA, idB){
    var data = computeStats();
    var a=driverById[idA], b=driverById[idB], sa=data.stats[idA], sb=data.stats[idB];
    var race = raceForDetail();
    var ra=resultFor(race,idA), rb=resultFor(race,idB);
    var absent = '<span style="color:var(--text-dim);font-weight:600;font-size:12px">Did not take part</span>';
    var dash = '&mdash;';

    function row(label, va, vb, better){
      // better: 'a' | 'b' | null
      return '<div class="h2h-row">'+
        '<div class="h2h-val left'+(better==='a'?' h2h-win':'')+'">'+va+'</div>'+
        '<div class="metric">'+esc(label)+'</div>'+
        '<div class="h2h-val right'+(better==='b'?' h2h-win':'')+'">'+vb+'</div>'+
      '</div>';
    }
    function better(x,y,lowerIsBetter){
      if(x==null||y==null||x===y) return null;
      if(lowerIsBetter) return x<y?'a':'b';
      return x>y?'a':'b';
    }

    return ''+
    '<div style="display:flex;justify-content:space-between;margin:14px 0 4px;font-weight:800;font-family:\'Titillium Web\',sans-serif">'+
      '<span style="color:'+a.color+'">'+esc(a.name)+'</span><span style="color:'+b.color+'">'+esc(b.name)+'</span>'+
    '</div>'+
    row('Championship Pos.', 'P'+sa.position, 'P'+sb.position, better(sa.position,sb.position,true))+
    row('Total Points', sa.totalPoints, sb.totalPoints, better(sa.totalPoints,sb.totalPoints,false))+
    row('Projected Points', sa.projectedTotal, sb.projectedTotal, better(sa.projectedTotal,sb.projectedTotal,false))+
    row('Best Qualifying', sa.bestGrid!=null?('P'+sa.bestGrid):'N/A', sb.bestGrid!=null?('P'+sb.bestGrid):'N/A', better(sa.bestGrid,sb.bestGrid,true))+
    row('Races Finished', sa.finishedCount+'/'+sa.racesDone, sb.finishedCount+'/'+sb.racesDone, better(sa.finishedCount,sb.finishedCount,false))+
    row('Fastest Lap Awards', sa.fastestLapCount, sb.fastestLapCount, better(sa.fastestLapCount,sb.fastestLapCount,false))+
    row('Wins', sa.winCount, sb.winCount, better(sa.winCount,sb.winCount,false))+
    '<div class="h2h-round-head">'+esc(roundTag(race))+' &middot; '+esc(race.name)+'</div>'+
    row('Quali Time', ra ? (ra.qualiTimeStr||dash) : absent, rb ? (rb.qualiTimeStr||dash) : absent, better(ra&&ra.qualiTime, rb&&rb.qualiTime, true))+
    row('Best Lap', ra ? (ra.bestLapStr||dash) : absent, rb ? (rb.bestLapStr||dash) : absent, better(ra&&ra.bestLap, rb&&rb.bestLap, true))+
    row('Result', ra ? esc(ra.finishLabel) : absent, rb ? esc(rb.finishLabel) : absent, better(ra&&ra.finishPos, rb&&rb.finishPos, true))+
    row('Points scored', ra ? ra.points : dash, rb ? rb.points : dash, better(ra&&ra.points, rb&&rb.points, false));
  }

  function renderAdmin(){
    var d = driverById[currentUser];
    if(!d.isAdmin){
      return '<div class="card"><p>This tab is only visible to the league admin.</p></div>';
    }
    var rows = DRIVERS.map(function(x){
      return '<tr>'+
        '<td>'+esc(x.name)+'</td>'+
        '<td style="color:var(--text-dim)">'+(x.gamertag?esc(x.gamertag):'—')+'</td>'+
        '<td class="num">'+esc(x.username)+'</td>'+
        '<td class="num">'+esc(x.password)+'</td>'+
        '<td><span class="team-badge" style="background:'+x.color+';color:'+x.textOnColor+'">'+esc(x.team)+'</span></td>'+
      '</tr>';
    }).join('');

    var data = computeStats();
    var calRows = calendar.map(function(c){
      var dtVal='';
      if(c.date){ try{ dtVal = new Date(c.date).toISOString().slice(0,16); }catch(e){} }
      var raced = RACES.find(function(r){ return r.round===c.round && r.completed; });
      var locked = !!raced;
      return '<div class="cal-edit-row">'+
        '<div class="cal-edit-num">R'+c.round+'</div>'+
        '<input class="cal-name-input" data-round="'+c.round+'" type="text" value="'+esc(raced ? raced.name : (c.name||''))+'"'+(locked?' disabled':'')+'>'+
        '<input class="cal-date-input" data-round="'+c.round+'" type="datetime-local" value="'+dtVal+'"'+(locked?' disabled':'')+'>'+
      '</div>';
    }).join('');

    return ''+
    '<div>'+
      '<h2 class="section-title">League Admin</h2>'+
      '<p class="section-sub">Visible only to William</p>'+
    '</div>'+
    '<div class="card">'+
      '<h2>Everyone\'s Login</h2>'+
      '<div class="admin-warning">These are stored as plain text in the app itself — this is a fun league tool, not real security. Don\'t reuse these passwords anywhere else.</div>'+
      '<div class="tbl-wrap"><table class="tbl">'+
        '<thead><tr><th>Name</th><th>Gamertag</th><th>Username</th><th>Password</th><th>Team</th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
    '</div>'+
    '<div class="card cd-editor">'+
      '<h2>Season Calendar</h2>'+
      '<p class="section-sub" style="margin-bottom:10px">Sets the name/date for every round. Rounds already raced are locked. The next round to run drives the countdown banner.</p>'+
      calRows+
      '<button class="btn" id="cal-save-btn" style="margin-top:10px">Save Calendar</button>'+
      '<div class="save-msg" id="cal-save-msg"></div>'+
    '</div>';
  }

  /* ===================== WIRE DYNAMIC BITS ===================== */
  function wireDynamic(){
    initNewsTicker();
    animateCharts();
    var homeToggle = document.getElementById('home-mode-toggle');
    if(homeToggle) homeToggle.addEventListener('click', onModeClick);
    var standingsToggle = document.getElementById('standings-mode-toggle');
    if(standingsToggle) standingsToggle.addEventListener('click', onModeClick);

    Array.prototype.forEach.call(document.querySelectorAll('#main .round-pick'), function(btn){
      btn.addEventListener('click', function(){
        detailRoundNum = parseInt(btn.getAttribute('data-round'), 10);
        playClick();
        renderMain();
      });
    });

    var h2hA = document.getElementById('h2h-a'), h2hB = document.getElementById('h2h-b');
    if(h2hA && h2hB){
      function refreshH2H(){
        h2hSel.a = h2hA.value; h2hSel.b = h2hB.value;
        document.getElementById('h2h-body').innerHTML = renderH2HBody(h2hA.value, h2hB.value);
      }
      h2hA.addEventListener('change', refreshH2H);
      h2hB.addEventListener('change', refreshH2H);
      refreshH2H();
    }

    var calSaveBtn = document.getElementById('cal-save-btn');
    if(calSaveBtn){
      calSaveBtn.addEventListener('click', function(){
        var names = document.querySelectorAll('.cal-name-input');
        var dates = document.querySelectorAll('.cal-date-input');
        var rounds = calendar.map(function(c){ return { round:c.round, name:c.name, date:c.date }; });
        completedRaces().forEach(function(r){
          var e = rounds.find(function(x){ return x.round===r.round; });
          if(e) e.name = r.name;
        });
        names.forEach(function(inp){
          var r = parseInt(inp.dataset.round,10);
          var entry = rounds.find(function(x){return x.round===r;});
          if(entry && !inp.disabled) entry.name = inp.value.trim() || ('Round '+r);
        });
        dates.forEach(function(inp){
          var r = parseInt(inp.dataset.round,10);
          var entry = rounds.find(function(x){return x.round===r;});
          if(entry && !inp.disabled) entry.date = inp.value ? new Date(inp.value).toISOString() : null;
        });
        var msg = document.getElementById('cal-save-msg');
        var willSync = !!calendarRef;
        msg.className='save-msg'; msg.textContent='Saving...';
        saveCalendar(rounds).then(function(){
          msg.className='save-msg ok';
          playSaveSuccess();
          msg.textContent = willSync ? 'Saved — everyone will see this.' : 'Saved on this device only (live sync unavailable here).';
        }).catch(function(){
          msg.className='save-msg err'; msg.textContent='Could not sync — saved on this device only.';
        });
      });
    }
  }
  function onModeClick(e){
    var btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    chartMode = btn.getAttribute('data-mode');
    renderMain();
  }

  /* ===================== BOOT ===================== */
  initDb();
  if(currentUser) enterApp();
})();
</script>
